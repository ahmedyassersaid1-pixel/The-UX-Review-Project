<html>
  <head>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/media.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>The UX Review Blog</title>
  </head>
  <body>
    <!-- start nav section -->
    <nav>
      <div class="container nav-container">
        <div class="logo">
          <h1>The UX <span>Review</span></h1>
        </div>
        <div class="nav-links">
          <ul>
            <li>
              <a href="#HOME">HOME </a>
              <img src="./Images/star in navbar.png" alt="star-logo" />
            </li>
            <li>
              <a href="#LATEST_ARTICLES">LATEST ARTICLES </a>
              <img src="./Images/star in navbar.png" alt="star-logo" />
            </li>
            <li>
              <a href="#AUTHORS"> AUTHORS </a>
              <img src="./Images/star in navbar.png" alt="star-logo" />
            </li>
            <li><a href="#COMMUNITY"> COMMUNITY</a></li>
          </ul>
        </div>
        <div class="nav-btn">
          <button type="button">SUBSCRIBE NOW</button>
        </div>
      </div>
    </nav>
    <!-- end nav section -->

    <!-- start section one -->
    <div class="sec-one">
      <div class="container">
        <div class="text-sec-one">
          <div class="trending">
            <span>🔥 TRENDING NOW</span>
          </div>
          <div class="head-sec-one">
            <h2>
              <span class="one">BRUTAL</span>
              <br />
              <span class="two">THOUGHTS</span>
              <br />
              <span class="three">BOLD IDEAS</span>
            </h2>
          </div>
          <p>
            Raw, unfiltered content about tech, design, and culture. No
            sugar-coating, just pure truth that hits different.
          </p>
          <div class="sec-one-btn">
            <button type="button">
              <span
                ><div class="image">
                  <img
                    src="./Images/rocket-solid-full.png"
                    alt="rocket-solid-image"
                  /></div
              ></span>
              <span>START READING</span>
            </button>
            <button type="button" class="btn-two">
              <span>
                <div class="image">
                  <img
                    src="./Images/play-solid-full.png"
                    alt="play-solid-image"
                  /></div
              ></span>
              <span>WATCH INTRO</span>
            </button>
          </div>
        </div>
        <div class="right-sec-one">
          <div class="txt">FEATURED</div>
          <div class="image-sec-one"></div>
        </div>
      </div>
    </div>
    <!-- end section one -->
